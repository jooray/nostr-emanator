# Zapstore listing for the Android app. Releases come from GitHub: each one
# carries the signed emanator-<version>.apk (see AGENTS.md, "Releasing the app").
name: Emanator
summary: Schedule posts and handle replies and messages for all your Nostr accounts
description: |
  Emanator schedules posts and reposts for every Nostr account you manage. Write with AI help that knows each account's voice, attach photos, pick a time, and approve the signature in Amber. Emanator publishes at that time.

  It also gathers the replies, mentions and private messages of every account in one place, so you can answer as the right identity. Type @ in a post to mention one of your accounts or someone they follow.

  The app works with the same Emanator server as the website, so drafts, schedules, private messages and settings are shared between them.

  Photos are resized and stripped of location and camera metadata on the phone before upload. Media servers keep exactly the bytes they receive, so this is the only point where it can be done.

  Logins and account pairing go through Amber on the same phone, with no QR code to scan. Without a signer on the phone, the QR code for one on another device shows up right away. Emanator never sees your private key.

  Videos are re-encoded on the phone too (H.264, at most 30 frames per second, without location metadata). A clip small enough to upload as it is lets you choose: the original, the re-encoded copy, or whichever of the two is smaller. On a tablet a side rail replaces the bottom bar.

  Available in English, Slovak, Czech and Spanish. Open source: self-hosters can point the app at their own server.
