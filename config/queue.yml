default: &default
  dispatchers:
    - polling_interval: 5
      batch_size: 500
  workers:
    - queues: "auth"
      threads: <%= ENV.fetch("AUTH_JOB_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 1
    - queues: "default"
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
