default: &default
  dispatchers:
    - polling_interval: 5
      batch_size: 500
  workers:
    - queues: [ "auth" ]
      threads: <%= ENV.fetch("AUTH_JOB_CONCURRENCY", 1) %>
      processes: 1
      polling_interval: 1
    # H7: dedicated queue for NIP-46 signing jobs (each can block up to 120s
    # waiting on Amber) so they no longer share worker threads with
    # publishing jobs and cause head-of-line blocking.
    - queues: [ "signing" ]
      threads: <%= ENV.fetch("SIGNING_JOB_CONCURRENCY", 2) %>
      processes: 1
      polling_interval: 1
    # `solid_queue_recurring` is where SolidQueue::RecurringJob lands — every
    # `command:` entry in recurring.yml is wrapped in one. (Entries with
    # `class:` are enqueued as that class, so they land on `default`.) Leaving
    # it off this list silently strands the whole command-based half of the
    # schedule: the scheduler keeps enqueueing and nothing ever claims. It was
    # missing until 2026-07-20, so cleanup_nostr_auth_sessions,
    # clear_solid_queue_finished_jobs and — most importantly — the
    # ensure_nip46_supervisor login safety net had not run since 2026-07-16,
    # while the `class:` tasks (EnqueueScheduledPostsJob, SweepStuckRecordsJob)
    # kept working and made the app look healthy.
    #
    # Must be a YAML *list*. Solid Queue does `Array(options[:queues])`, which
    # turns the string "default,solid_queue_recurring" into one bogus queue name
    # containing a comma rather than into two names — the worker then matches
    # nothing at all, including the queue that used to work.
    - queues: [ "default", "solid_queue_recurring" ]
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
