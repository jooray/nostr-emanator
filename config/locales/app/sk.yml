      help: Mediálne servery uchovávajú presne tie bajty, ktoré dostanú, preto sa fotky zmenšujú ešte predtým, ako opustia prehliadač alebo telefón. Pri prekódovaní zmiznú aj údaje o polohe a fotoaparáte.
      compress: Pred nahraním fotky zmenšiť
      max_edge: Dlhšia strana
      original_size: Pôvodná veľkosť
