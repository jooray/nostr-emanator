        compression: Fotky sa ešte v telefóne zmenšia a zbavia údajov o polohe a fotoaparáte, až potom sa nahrajú.
        signer: Prihlásenie a párovanie potvrdíš v Amberi na tom istom telefóne, bez skenovania QR kódu.
        local: Zoznamy sa otvoria hneď z kópie v telefóne a potom sa obnovia.
      version_html: Aktuálna verzia %{version}
      zapstore: Stiahnuť zo Zapstore
      download: Stiahnuť APK
      obtainium: Pridať do Obtainium pre automatické aktualizácie
      fingerprint: SHA-256 podpisového certifikátu
      not_yet: Prvá verzia je na ceste.

