cs:
  # Formats used across the app with l(time, format: :app_*). Translators may
  # reorder day and month here; the English values match the old strftime calls.
  time:
    formats:
      app_time: "%H:%M"
      app_date: "%-d. %-m. %Y"
      app_short: "%-d. %-m. %H:%M"
      app_datetime: "%-d. %-m. %Y %H:%M"
      app_day_month: "%-d. %-m."

  # Post / repost / action status names (ApplicationHelper#status_label).
  status_labels:
    draft: Koncept
    pending: Čeká
    pending_signature: Čeká na podpis
    awaiting_signature: Čeká na schválení v podepisovači
    processing: Zpracovává se
    scheduled: Naplánováno
    publishing: Zveřejňuje se
    published: Zveřejněno
    failed: Selhalo

  # ConsoleHelper: lamps, poll strips, delivery sentences, status slugs.
  console:
    poll_strip:
      accepted: přijato
    delivery:
      all:
        one: Dosáhlo to na jediný relay, který měl.
        few: Dosáhlo to na všechny %{count} relaye.
        other: Dosáhlo to na všech %{count} relayů.
      partial:
        one: "Dosaženo %{ok} z %{count} relaye, což je normální zveřejnění."
        few: "Dosaženo %{ok} z %{count} relayů, což je normální zveřejnění."
        other: "Dosaženo %{ok} z %{count} relayů, což je normální zveřejnění."
      thin:
        one: "Dosaženo jen 1 z %{count} relaye, prakticky neviditelné."
        few: "Dosaženo jen 1 z %{count} relayů, prakticky neviditelné."
        other: "Dosaženo jen 1 z %{count} relayů, prakticky neviditelné."
      none:
        one: Nedosáhlo to na jediný relay, na který to bylo posláno.
        few: "Nedosáhlo to na žádný z %{count} relayů, na které to bylo posláno."
        other: "Nedosáhlo to na žádný z %{count} relayů, na které to bylo posláno."
      not_published: Zatím nezveřejněno.
    slug:
