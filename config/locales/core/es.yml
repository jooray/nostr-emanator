      event_viewer_updated: Visor de eventos actualizado.
      custom_relays_updated: Relays personalizados actualizados.
      settings_updated: Ajustes actualizados.
    api_tokens:
      title: Tokens de API (MCP)
      intro_html: Conecta un agente de IA a Emanator mediante %{mcp_link}. Apunta tu cliente MCP a %{endpoint} y envía el token como %{header}.
      mcp_link: Model Context Protocol
      warning_html: '<strong>Un token puede publicar como si fueras tú.</strong> Lee tus cuentas y publicaciones, crea borradores y <strong>programa publicaciones que luego se firman y publican automáticamente bajo cualquiera de tus identidades vinculadas, sin ningún paso de aprobación adicional</strong>, porque tu firmante aprueba las notas kind 1 sin preguntar. Trata un token como una clave de publicación: dáselo solo a un agente al que dejarías hablar en nombre de estas cuentas, y revócalo aquí en cuanto dejes de confiar en él.'
      created_html: "Token <strong>%{name}</strong> creado. Cópialo ahora: no se volverá a mostrar."
      copy: Copiar
      name_label: Nombre del token
      name_placeholder: p. ej. content-agent
      expires_label: Expira
      expiry:
        days_30: 30 días
        days_90: 90 días
        days_180: 180 días
        year: 1 año
        never: Nunca
      generate: Generar token
      columns:
        name: Nombre
        created: Creado
        expires: Expira
        last_used: Último uso
      never: Nunca
      expired_on: Expiró el %{date}
      ago: "hace %{time}"
      revoke: Revocar
      revoke_confirm: "¿Revocar este token? Cualquier cosa que lo use perderá el acceso."
      empty: Todavía no hay tokens.

  api_tokens:
    create:
      name_required: Se requiere un nombre para el token.
    destroy:
