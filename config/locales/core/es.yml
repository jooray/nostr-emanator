es:
  # Formats used across the app with l(time, format: :app_*). Translators may
  # reorder day and month here; the English values match the old strftime calls.
  time:
    formats:
      app_time: "%H:%M"
      app_date: "%-d %b %Y"
      app_short: "%-d %b %H:%M"
      app_datetime: "%-d %b %Y %H:%M"
      app_day_month: "%-d %b"

  # Post / repost / action status names (ApplicationHelper#status_label).
  status_labels:
    draft: Borrador
    pending: Pendiente
    pending_signature: Firma pendiente
    awaiting_signature: Esperando aprobación en el firmante
    processing: Procesando
    scheduled: Programado
    publishing: Publicando
    published: Publicado
    failed: Fallido

  # ConsoleHelper: lamps, poll strips, delivery sentences, status slugs.
  console:
    poll_strip:
      accepted: aceptado
    delivery:
      all:
        one: Alcanzó los %{count} relays.
        other: Alcanzó los %{count} relays.
      partial:
        one: Alcanzó %{ok} de %{count} relays, lo cual es una publicación normal.
        other: Alcanzó %{ok} de %{count} relays, lo cual es una publicación normal.
      thin:
        one: "Alcanzó solo 1 de %{count} relays: prácticamente invisible."
        other: "Alcanzó solo 1 de %{count} relays: prácticamente invisible."
      none:
        one: No alcanzó ninguno de los %{count} relays a los que se envió.
        other: No alcanzó ninguno de los %{count} relays a los que se envió.
      not_published: Todavía no se publicó.
    slug:
      approve_on_phone: Aprobar en el teléfono
      barely_out: Apenas salió %{tally}
      failed: Falló
      sending: Enviando
      held: En espera

  application:
    sign_in_required: Inicia sesión para continuar

  activerecord:
    attributes:
      user:
        custom_relays: Relays personalizados
    errors:
      models:
        user:
          attributes:
            custom_relays:
              unsafe_relay: "%{relay} no se puede usar: los relays deben ser URLs wss:// en hosts públicos"

  layouts:
    application:
      skip_to_content: Saltar al contenido
    navigation:
      theme: Tema
      station_status: Estado de la estación
      readings:
        identities:
          one: "%{count} identidad"
          other: "%{count} identidades"
        waiting:
          one: "%{count} esperando firma"
          other: "%{count} esperando firma"
        short:
          one: "%{count} con entrega corta"
          other: "%{count} con entrega corta"
        failed:
          one: "%{count} sin salir"
          other: "%{count} sin salir"
      signed_in: Sesión iniciada
      sign_out_confirm: "¿Cerrar sesión en Emanator?"
      out: Salir
      sign_out: Cerrar sesión
