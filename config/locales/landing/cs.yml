cs:
  home:
    index:
      meta_description: Emanator plánuje tvoje příspěvky na Nostru a koordinuje reposty napříč účty, které spravuješ.
      title: Emanator - Dej každé identitě na Nostru náskok
      skip_to_content: Přeskočit na obsah
      main_navigation: Hlavní navigace
      home_label: "Emanator – domů"
      theme_toggle_title: Přepnout barevný motiv
      switch_to_dark: Přepnout na tmavý režim
      switch_to_light: Přepnout na světlý režim
