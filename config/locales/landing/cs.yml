      hero:
        eyebrow: Plánování pro Nostr
        title_html: Dej každé identitě <span class="accent-word">náskok.</span>
        lead: "Nový účet na Nostru začíná bez publika. Emanator mu pomůže nastartovat pomocí účtů, které už provozuješ: příspěvek napíšeš jednou, naplánuješ čas zveřejnění a přidáš reposty z dalších účtů, které ho podpoří."
        see_how: Jak to funguje
        key_note: Tvoje klíče zůstávají v tvém Nostr podepisovači.
        stage_label: Emanator na počítači i v mobilu
        dashboard_alt: "Přehled Emanatoru: nahoře jeden příspěvek čekající na podpis, pod ním časová osa naplánovaných příspěvků z pěti spravovaných účtů na Nostru, každý s časem, účtem a textem"
      proof:
        label: Principy produktu
        intro: Vytvořeno pro účty, které potřebují dosah, ne další sociální přehled.
        calendar: Jeden kalendář pro každý účet, který spravuješ.
        signing: Vzdálené podepisování přes Amber. Emanator nikdy neukládá tvůj soukromý klíč.
        always_on: Příspěvky a reposty vycházejí včas, i když jsou tvá zařízení offline.
      workflow:
        title: Od tiché identity ke koordinovanému spuštění.
        lead: Účty, které už provozuješ, si navzájem pomůžou, takže nemusíš publikovat na každý ručně.
        connect_label: 01 / Připojit
        connect_title: Spáruj své účty
        connect_body: Připoj účty, které spravuješ, přes Amber pomocí vzdáleného podepisování NIP-46.
        compose_label: 02 / Napsat
        compose_title: Napiš příspěvek
        compose_body: Napiš text a přilož média. Každý účet má vlastní styl, takže ti AI asistent pomůže, aniž by ze všech udělal jeden hlas.
        emanate_label: 03 / Emanuj
        emanate_title: Naplánuj a podepiš
        emanate_body: Vyber, kdy má příspěvek vyjít, nastav náhodné zpoždění repostů a podepiš jedním klikem. O zbytek se ve správný čas postará Emanator.
      control:
        title: Automatizace s jasnou kontrolou nad klíči.
        lead: "Staví na tom, jak Nostr už funguje: tvoje identita je přenositelná, relaye jsou otevřené a podepisovací klíče máš ve svých rukou."
        publishing_tag: Kontrola nad publikováním
        publishing_title: Každý příspěvek a repost vidíš dřív, než vyjde.
        publishing_body: Jeden kalendář ukazuje, co má každý účet naplánované na celý měsíc, takže nic nevyjde bez tvého vědomí.
        calendar_alt: "Kalendář Emanatoru pro říjen 2026 s naplánovanými příspěvky a reposty den po dni, barevně odlišenými podle účtu"
        identity_tag: Identita na prvním místě
        identity_title: Klíče má tvůj podepisovač.
        identity_body: Emanator žádá tvůj podepisovač o schválení každé události přes NIP-46. Tvůj soukromý klíč zůstává v Amberu, kam patří.
        no_custody: Bez úschovy nsec
        ai_tag: AI, která zná každý účet
        ai_title: Ať každý účet zní jako on sám.
        ai_body: Dej každému účtu vlastní styl. AI píše a upravuje v tomto tónu, místo aby ze všech udělala jeden obecný hlas.
      tour:
        title: Celý postup na webu i v mobilu.
        lead: Piš, plánuj a sleduj odpovědi odkudkoliv. Rozhraní se řídí světlým nebo tmavým motivem tvého systému.
        interactions_alt: "Zobrazení interakcí v Emanatoru se zmínkami několika spravovaných účtů a akcemi líbí se mi, sledovat, ztlumit a odpovědět"
        interactions_title: Jedna schránka pro odpovědi a zmínky
        interactions_body: Čti zmínky a odpovědi pro každý účet, který provozuješ, a odpovídej bez opuštění aplikace.
        calendar_alt: "Měsíční kalendář Emanatoru, kde má každý příspěvek barvu svého účtu a reposty jsou označené jako repost"
        calendar_title: Měsíc, podle kterého můžeš plánovat
        calendar_body: Naplánované příspěvky a jejich reposty jsou vedle sebe, takže spouštěcí týden přečteš na první pohled.
        mobile_label: Emanator v mobilu
        compose_light_alt: "Psaní nového příspěvku v Emanatoru na mobilu, s tlačítkem pro přílohu a tlačítkem Uložit a naplánovat pod editorem"
        compose_dark_alt: Psaní nového příspěvku v Emanatoru na mobilu v tmavém motivu
        compose_caption: Napsat
        schedule_light_alt: Výběr data a času zveřejnění v Emanatoru na mobilu s účty pro repost uvedenými níže
        schedule_dark_alt: Výběr data a času zveřejnění v Emanatoru na mobilu v tmavém motivu
        schedule_caption: Naplánovat
        review_light_alt: Kalendář Emanatoru na mobilu zobrazující měsíc s naplánovanými příspěvky
        review_dark_alt: Kalendář Emanatoru na mobilu v tmavém motivu
        review_caption: Zkontrolovat
      cta:
        title: Ať signál nesou správné účty.
        body: Příští spuštění na Nostru řiď z jednoho kalendáře. Každý účet zůstává nezávisle tvůj.
        button: Spustit Emanator
      footer:
        back_to_top: Nahoru
        tagline: Plánování příspěvků pro otevřenou sociální síť.
        github_label: Zobrazit zdrojový kód na GitHubu
      nav_pricing: Ceník
      language_menu: "Jazyk: %{language}"
      pricing:
        title: Plánování je zdarma. Za AI psaní se platí v satech.
        lead: Účtem je tvůj Nostr klíč. Žádný e-mail, heslo ani karta.
        free_tag: Emanator
        free_price: Zdarma
        free_note: všechno kromě AI psaní
        free_scheduling: Plánování, reposty z tvých dalších účtů, kalendář, odpovědi i soukromé zprávy.
        free_accounts: Připoj až 10 účtů. Psaní s AI nebo jeho zkušební období limit ruší.
        free_self_host_html: Otevřený zdrojový kód. <a href="https://github.com/jooray/nostr-emanator">Spusť si ho sám</a> s vlastním AI klíčem a neplatíš nic.
        ai_tag: AI psaní
        ai_price: 3 dny zdarma
        ai_note: pak 10 000 satů na 30 dní
        ai_trial: Zkušební doba začne, až když poprvé necháš AI napsat nebo upravit příspěvek, ne při registraci.
        ai_pro_rata: Zaplať přes Lightning libovolnou částku a dostaneš poměrný počet dní. 5 000 satů je 15 dní, minimum je 1 000.
        ai_keep_days: Když zaplatíš během zkušební doby, nevyčerpané dny ti zůstanou.
        bundle_tag: Všechno v jednom
        bundle_price: 25 000 satů
        bundle_note: na 30 dní
        bundle_covers_html: Pokrývá AI psaní tady, hostovaný <a href="https://nalgorithm.cypherpunk.today">nalgorithm</a> (seřadí příspěvky lidí, které sleduješ, a ráno ti je přečte jako hlasový přehled) a <a href="https://lievik.cypherpunk.today">Lievik</a> (vybere, co stojí za to poslat kterému publiku).
        bundle_keep_days: Dny, které už máš zaplacené v kterékoli ze tří aplikací, ti zůstanou.
        bundle_saving: Samostatně stojí všechny tři 35 000 satů.
        fine: Kdyby platební systém nebyl dostupný, plánování a publikování fungují dál.
        terms_html: 'Zkušební doba, vracení peněz, soukromí a podpora: <a href="https://cypherpunk.today/cs/terms/">podmínky</a>.'
      install:
        title: "Dej si ho na plochu."
        lead: "Emanator je webová aplikace, kterou si můžeš nainstalovat. Otevře se ve vlastním okně a má všechny funkce, na iPhonu, iPadu, Androidu i počítači. Obchod s aplikacemi nepotřebuješ."
        web_tag: "Webová aplikace"
        web_title: "Jedna aplikace pro všechna zařízení."
        web_body: "Nainstalovaná webová aplikace je celý Emanator: plánování, reposty, kalendář, odpovědi, zprávy, nahrávání médií i psaní s AI. Když vyjde nová verze, aktualizuje se sama."
        ios_label: "iPhone a iPad"
        ios_steps: "Otevři Emanator v Safari, klepni na Sdílet a pak na Přidat na plochu."
        android_label: "Android"
        android_steps: "V Chromu otevři menu a klepni na Přidat na plochu nebo Nainstalovat aplikaci."
        desktop_label: "Počítač"
        desktop_steps: "V Chromu nebo Edge klikni na ikonu instalace v adresním řádku. V Safari na Macu zvol Soubor a pak Přidat do Docku."
        signer_note: "Podepisovač Amber běží jen na Androidu. Na iPhonu nebo iPadu použij jakýkoli podepisovač, který podporuje vzdálené podepisování přes NIP-46."
        native_tag: "Volitelné"
        native_title: "Chceš raději nativní aplikaci pro Android?"
        native_body: "I ta existuje. Umí totéž a pracuje se stejným serverem, takže mezi ní a webem můžeš kdykoli přepínat."
        zapstore: "Stáhnout ze Zapstore"
        obtainium: "Přidat do Obtainium"
        github: "Stáhnout z GitHubu"
        more: "Víc o aplikaci pro Android"
        android_title: "Dej si Emanator do telefonu."
        android_lead: "Na Androidu se nejlépe hodí nativní aplikace. Na iPhonu, iPadu a počítači si nainstaluj webovou aplikaci. Obě mají všechny funkce a pracují se stejným serverem."
        native_android_tag: "Doporučujeme na Android"
        native_android_title: "Stáhni si aplikaci pro Android."
        native_android_body: "Používá výběr souborů přímo v telefonu a dá se do ní sdílet z jiných aplikací. Fotky a videa zmenší ještě před nahráním. Přihlášení a párování potvrdíš v Amberu na stejném telefonu, bez QR kódu."
        web_too: "Pokud chceš, funguje i webová aplikace. V Chromu otevři menu a klepni na Přidat na plochu."
