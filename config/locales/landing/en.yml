en:
  home:
    index:
      meta_description: Emanator schedules your Nostr posts and coordinates reposts across the accounts you run.
      title: Emanator - Give every Nostr identity a head start
      skip_to_content: Skip to content
      main_navigation: Main navigation
      home_label: Emanator home
      theme_toggle_title: Toggle color theme
      switch_to_dark: Switch to dark mode
      switch_to_light: Switch to light mode
      launch_app: Launch app
      hero:
        eyebrow: Scheduling for Nostr
        title_html: Give every identity a <span class="accent-word">head start.</span>
        lead: "A new Nostr account starts with no audience. Emanator lets the accounts you already run give it a push: write a post once, schedule when it goes out, and line up reposts from your other accounts to follow."
        see_how: See how it works
        key_note: Your keys stay with your Nostr signer.
        stage_label: Emanator running on desktop and mobile
        dashboard_alt: "Emanator dashboard with one post waiting for a signature at the top, then a timeline of scheduled posts across five managed Nostr accounts, each with its time, account and text"
      proof:
        label: Product principles
        intro: Built for accounts that need reach, not another social dashboard.
        calendar: One calendar for every account you manage.
        signing: Remote signing through Amber. Emanator never stores your private key.
        always_on: Posts and reposts go out on time, even when your devices are offline.
      workflow:
        title: From a quiet identity to a coordinated launch.
        lead: Use the accounts you already run to back each other up, so you are not posting to each one by hand.
        connect_label: 01 / Connect
        connect_title: Pair your accounts
        connect_body: Connect the accounts you manage through Amber, using NIP-46 remote signing.
        compose_label: 02 / Compose
        compose_title: Write the post
        compose_body: Draft the note and attach media. Each account keeps its own style guide, so the AI assist can help without making everything sound the same.
        emanate_label: 03 / Emanate
        emanate_title: Schedule and sign
        emanate_body: Pick when it publishes, set random delays for the reposts, and sign once. Emanator sends everything at the right time.
      control:
        title: Automation with a clear chain of custody.
        lead: "Built on how Nostr already works: your identity is portable, the relays are open, and you hold the signing keys."
        publishing_tag: Publishing control
        publishing_title: See every post and repost before it goes out.
        publishing_body: One calendar shows what each account has queued across the month, so nothing publishes that you have not looked at.
        calendar_alt: "Emanator calendar for October 2026, with scheduled posts and reposts laid out day by day and color-coded by account"
        identity_tag: Identity first
        identity_title: Your signer holds the keys.
        identity_body: Emanator asks your signer to approve each event over NIP-46. Your Nostr private key stays in Amber, where it belongs.
        no_custody: No nsec custody
        ai_tag: Account-aware AI
        ai_title: Keep each account sounding like itself.
        ai_body: Give every account its own style guide. The AI drafts and edits in that voice, instead of flattening them all into one generic tone.
      tour:
        title: The whole workflow, on the web and your phone.
        lead: Draft, schedule, and keep an eye on replies from wherever you are. The interface follows your system light or dark theme.
        interactions_alt: "Emanator interactions view showing mentions of several managed accounts, with like, follow, mute and reply actions"
        interactions_title: One inbox for replies and mentions
        interactions_body: Read the mentions and replies for each account you run, then reply without leaving the app.
        calendar_alt: "Emanator month calendar with each post marked in its account's color and reposts labeled as reposts"
        calendar_title: A month you can plan against
        calendar_body: Scheduled posts and their reposts sit side by side, so a launch week is easy to read at a glance.
        mobile_label: Emanator on mobile
        compose_light_alt: "Composing a new post on Emanator mobile, with an attach button and Save & Schedule below the editor"
        compose_dark_alt: Composing a new post on Emanator mobile in dark theme
        compose_caption: Compose
        schedule_light_alt: Picking a publish date and time on Emanator mobile, with accounts to repost from listed below
        schedule_dark_alt: Picking a publish date and time on Emanator mobile in dark theme
        schedule_caption: Schedule
        review_light_alt: Emanator calendar on mobile showing the month with scheduled posts
        review_dark_alt: Emanator calendar on mobile in dark theme
        review_caption: Review
      cta:
        title: Let the right accounts carry the signal.
        body: Run your next Nostr launch from one calendar. Every account stays independently yours.
        button: Launch Emanator
      footer:
        back_to_top: Back to top
        tagline: Post scheduling for the open social web.
        github_label: View source on GitHub
      nav_pricing: Pricing
      language_menu: "Language: %{language}"
      pricing:
        title: Scheduling is free. AI writing costs sats.
        lead: Your Nostr key is your account. No email, no password, no card.
        free_tag: Emanator
        free_price: Free
        free_note: everything except AI writing
        free_scheduling: Scheduling, reposts from your other accounts, the calendar, replies and DMs.
        free_accounts: Pair up to 10 accounts. AI writing, or its trial, lifts the limit.
        free_self_host_html: Open source. <a href="https://github.com/jooray/nostr-emanator">Run it yourself</a> with your own AI key and nothing is paid.
        ai_tag: AI writing
        ai_price: 3 days free
        ai_note: then 10,000 sats per 30 days
        ai_trial: The trial starts the first time you ask the AI to write or edit a post, not when you sign up.
        ai_pro_rata: Pay any amount over Lightning, credited pro rata. 5,000 sats is 15 days, minimum 1,000.
        ai_keep_days: Pay during your trial and the unused days are kept.
        bundle_tag: All-access
        bundle_price: 25,000 sats
        bundle_note: per 30 days
        bundle_covers_html: Covers AI writing here, hosted <a href="https://nalgorithm.cypherpunk.today">nalgorithm</a> (your Nostr follows ranked, read to you as a morning voice digest) and <a href="https://lievik.cypherpunk.today">Lievik</a> (picks what is worth sending to each audience you write for).
        bundle_keep_days: Days you already paid for on any of the three are kept.
        bundle_saving: Separately the three cost 35,000 sats.
        fine: If billing is ever unreachable, scheduling and publishing keep working.
        terms_html: 'Trial, refunds, privacy and support: <a href="https://cypherpunk.today/terms/">the terms page</a>.'
      install:
        title: "Put it on your home screen."
        lead: "Emanator is a web app you can install. It opens in its own window and has every feature, on iPhone, iPad, Android and desktop. No app store needed."
        web_tag: "Web app"
        web_title: "One app for every device."
        web_body: "The installed web app is the full Emanator: scheduling, reposts, the calendar, replies, DMs, media uploads and AI writing. It updates itself when a new version comes out."
        ios_label: "iPhone and iPad"
        ios_steps: "Open Emanator in Safari, tap Share, then Add to Home Screen."
        android_label: "Android"
        android_steps: "In Chrome, open the menu and tap Add to Home screen or Install app."
        desktop_label: "Desktop"
        desktop_steps: "In Chrome or Edge, click the install icon in the address bar. In Safari on a Mac, choose File, then Add to Dock."
        signer_note: "Amber, the signer, runs only on Android. On an iPhone or iPad, use any signer that supports NIP-46 remote signing."
        native_tag: "Optional"
        native_title: "Prefer a native Android app?"
        native_body: "There is one. It does the same things and uses the same server, so you can switch between it and the web at any time."
        zapstore: "Get it on Zapstore"
        obtainium: "Add to Obtainium"
        github: "Download on GitHub"
        more: "More about the Android app"
        android_title: "Get Emanator on your phone."
        android_lead: "On Android, the native app is the best fit. On iPhone, iPad and desktop, install the web app. Both have every feature and use the same server."
        native_android_tag: "Recommended on Android"
        native_android_title: "Get the Android app."
        native_android_body: "It uses the phone's own file picker and takes shares from other apps. It shrinks photos and videos before upload. Logins and pairings are approved in Amber on the same phone, with no QR code."
        web_too: "The web app works too, if you prefer. In Chrome, open the menu and tap Add to Home screen."
