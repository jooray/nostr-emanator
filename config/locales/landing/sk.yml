        free_accounts: Pripoj až 10 účtov. Písanie s AI alebo jeho skúška limit ruší.
        free_self_host_html: Otvorený zdrojový kód. <a href="https://github.com/jooray/nostr-emanator">Spusti si ho sám</a> s vlastným AI kľúčom a neplatíš nič.
        ai_tag: AI písanie
        ai_price: 3 dni zadarmo
        ai_note: potom 10 000 satov na 30 dní
