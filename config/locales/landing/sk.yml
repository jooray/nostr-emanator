        ai_pro_rata: Zaplať cez Lightning ľubovoľnú sumu a dostaneš pomerný počet dní. 5 000 satov je 15 dní, minimum je 1 000.
        ai_keep_days: Ak zaplatíš počas skúšobnej doby, nevyčerpané dni ti zostanú.
