es:
  home:
    index:
      meta_description: Emanator programa tus publicaciones de Nostr y coordina reposts entre las cuentas que gestionas.
      title: Emanator - Dale ventaja a cada identidad de Nostr
      skip_to_content: Saltar al contenido
      main_navigation: Navegación principal
      home_label: Inicio de Emanator
      theme_toggle_title: Cambiar tema de color
      switch_to_dark: Cambiar a modo oscuro
      switch_to_light: Cambiar a modo claro
      launch_app: Abrir la app
      hero:
        eyebrow: Programación para Nostr
        title_html: Dale a cada identidad una <span class="accent-word">ventaja inicial.</span>
        lead: "Una cuenta nueva en Nostr empieza sin audiencia. Emanator deja que las cuentas que ya gestionas le den un empujón: escribe una publicación una vez, programa cuándo sale y encadena reposts desde tus otras cuentas para que la sigan."
        see_how: Ver cómo funciona
        key_note: Tus claves se quedan en tu firmante de Nostr.
        stage_label: Emanator funcionando en escritorio y móvil
        dashboard_alt: "Panel de Emanator con una publicación esperando firma arriba y, debajo, la línea de tiempo de publicaciones programadas de cinco cuentas de Nostr gestionadas, cada una con su hora, cuenta y texto"
      proof:
        label: Principios del producto
        intro: Pensado para cuentas que necesitan alcance, no otro panel social más.
        calendar: Un calendario para cada cuenta que gestionas.
        signing: Firma remota mediante Amber. Emanator nunca guarda tu clave privada.
        always_on: Las publicaciones y los reposts salen a su hora, aunque tus dispositivos estén desconectados.
      workflow:
        title: De una identidad silenciosa a un lanzamiento coordinado.
        lead: Usa las cuentas que ya gestionas para que se respalden entre sí, en lugar de publicar en cada una a mano.
        connect_label: 01 / Conectar
        connect_title: Vincula tus cuentas
        connect_body: Conecta las cuentas que gestionas a través de Amber, con firma remota NIP-46.
        compose_label: 02 / Redactar
        compose_title: Escribe la publicación
        compose_body: Redacta la nota y adjunta contenido multimedia. Cada cuenta mantiene su propia guía de estilo, así que la ayuda de la IA puede colaborar sin que todo suene igual.
        emanate_label: 03 / Emanar
        emanate_title: Programa y firma
        emanate_body: Elige cuándo se publica, define retrasos aleatorios para los reposts y firma una sola vez. Emanator envía todo a la hora exacta.
      control:
        title: Automatización con una cadena de custodia clara.
        lead: "Construido sobre cómo ya funciona Nostr: tu identidad es portátil, los relays son abiertos y tú conservas las claves de firma."
        publishing_tag: Control de publicación
        publishing_title: Revisa cada publicación y repost antes de que salgan.
        publishing_body: Un calendario muestra lo que cada cuenta tiene en cola durante el mes, así que nada se publica sin que lo hayas visto.
        calendar_alt: "Calendario de Emanator de octubre de 2026, con publicaciones y reposts programados día a día y con el color de cada cuenta"
        identity_tag: La identidad primero
        identity_title: Tu firmante conserva las claves.
        identity_body: Emanator le pide a tu firmante que apruebe cada evento por NIP-46. Tu clave privada de Nostr se queda en Amber, donde debe estar.
        no_custody: Sin custodia de la nsec
        ai_tag: IA que conoce cada cuenta
        ai_title: Que cada cuenta siga sonando a sí misma.
        ai_body: Dale a cada cuenta su propia guía de estilo. La IA redacta y edita en esa voz, en lugar de aplanarlas todas a un mismo tono genérico.
      tour:
        title: Todo el flujo de trabajo, en la web y en tu móvil.
        lead: Redacta, programa y sigue las respuestas desde donde estés. La interfaz sigue el tema claro u oscuro de tu sistema.
        interactions_alt: "Vista de interacciones de Emanator con menciones a varias cuentas gestionadas y acciones de me gusta, seguir, silenciar y responder"
        interactions_title: Una bandeja para respuestas y menciones
        interactions_body: Lee las menciones y respuestas de cada cuenta que gestionas, y responde sin salir de la app.
        calendar_alt: "Calendario mensual de Emanator con cada publicación en el color de su cuenta y los reposts marcados como repost"
        calendar_title: Un mes que puedes planear
        calendar_body: Las publicaciones programadas y sus reposts aparecen uno junto al otro, así una semana de lanzamiento se lee de un vistazo.
        mobile_label: Emanator en el móvil
        compose_light_alt: "Redactando una nueva publicación en Emanator móvil, con el botón de adjuntar y el de guardar y programar debajo del editor"
        compose_dark_alt: Redactando una nueva publicación en Emanator móvil en tema oscuro
        compose_caption: Redactar
        schedule_light_alt: Eligiendo fecha y hora de publicación en Emanator móvil, con las cuentas para repost listadas debajo
        schedule_dark_alt: Eligiendo fecha y hora de publicación en Emanator móvil en tema oscuro
        schedule_caption: Programar
        review_light_alt: Calendario de Emanator en móvil mostrando el mes con publicaciones programadas
        review_dark_alt: Calendario de Emanator en móvil en tema oscuro
        review_caption: Revisar
      cta:
        title: Deja que las cuentas adecuadas lleven la señal.
        body: Gestiona tu próximo lanzamiento en Nostr desde un solo calendario. Cada cuenta sigue siendo tuya de forma independiente.
        button: Abrir Emanator
      footer:
        back_to_top: Volver arriba
        tagline: Programación de publicaciones para la web social abierta.
        github_label: Ver el código fuente en GitHub
      nav_pricing: Precios
      language_menu: "Idioma: %{language}"
      pricing:
        title: Programar es gratis. La escritura con IA se paga en sats.
        lead: Tu clave de Nostr es tu cuenta. Sin correo, sin contraseña, sin tarjeta.
        free_tag: Emanator
        free_price: Gratis
        free_note: todo menos la escritura con IA
        free_scheduling: Programación, reposts desde tus otras cuentas, el calendario, respuestas y mensajes directos.
        free_accounts: Conecta hasta 10 cuentas. La escritura con IA, o su prueba, quita el límite.
        free_self_host_html: Código abierto. <a href="https://github.com/jooray/nostr-emanator">Instálalo tú mismo</a> con tu propia clave de IA y no pagas nada.
        ai_tag: Escritura con IA
        ai_price: 3 días gratis
        ai_note: luego 10.000 sats cada 30 días
        ai_trial: La prueba empieza la primera vez que le pides a la IA que escriba o edite una publicación, no al registrarte.
        ai_pro_rata: Paga la cantidad que quieras por Lightning y se te abona en proporción. 5.000 sats son 15 días, mínimo 1.000.
        ai_keep_days: Si pagas durante la prueba, conservas los días que te quedaban.
        bundle_tag: Acceso total
        bundle_price: 25.000 sats
        bundle_note: cada 30 días
        bundle_covers_html: Incluye la escritura con IA de aquí, <a href="https://nalgorithm.cypherpunk.today">nalgorithm</a> alojado (ordena lo que publica la gente que sigues y te lo lee cada mañana en un resumen de voz) y <a href="https://lievik.cypherpunk.today">Lievik</a> (elige qué vale la pena mandar a cada público para el que escribes).
        bundle_keep_days: Conservas los días que ya hubieras pagado en cualquiera de las tres apps.
        bundle_saving: Por separado, las tres cuestan 35.000 sats.
        fine: Si el sistema de pagos dejara de responder, la programación y la publicación siguen funcionando.
        terms_html: 'Prueba, reembolsos, privacidad y soporte: <a href="https://cypherpunk.today/es/terms/">las condiciones</a>.'
      install:
        title: "Ponlo en tu pantalla de inicio."
        lead: "Emanator es una app web que puedes instalar. Se abre en su propia ventana y tiene todas las funciones, en iPhone, iPad, Android y ordenador. No hace falta ninguna tienda de apps."
        web_tag: "App web"
        web_title: "Una app para todos tus dispositivos."
        web_body: "La app web instalada es Emanator completo: programación, reposts, el calendario, respuestas, mensajes directos, subida de archivos y escritura con IA. Se actualiza sola cuando sale una versión nueva."
        ios_label: "iPhone y iPad"
        ios_steps: "Abre Emanator en Safari, toca Compartir y luego Añadir a pantalla de inicio."
        android_label: "Android"
        android_steps: "En Chrome, abre el menú y toca Añadir a pantalla de inicio o Instalar aplicación."
        desktop_label: "Ordenador"
        desktop_steps: "En Chrome o Edge, haz clic en el icono de instalar de la barra de direcciones. En Safari en un Mac, elige Archivo y luego Añadir al Dock."
        signer_note: "Amber, el firmante, solo funciona en Android. En iPhone o iPad, usa cualquier firmante compatible con la firma remota NIP-46."
        native_tag: "Opcional"
        native_title: "¿Prefieres una app nativa para Android?"
        native_body: "También existe. Hace lo mismo y usa el mismo servidor, así que puedes pasar de ella a la web cuando quieras."
        zapstore: "Descargar en Zapstore"
        obtainium: "Añadir a Obtainium"
        github: "Descargar en GitHub"
        more: "Más sobre la app para Android"
        android_title: "Lleva Emanator en tu teléfono."
        android_lead: "En Android, lo mejor es la app nativa. En iPhone, iPad y ordenador, instala la app web. Las dos tienen todas las funciones y usan el mismo servidor."
        native_android_tag: "Recomendada en Android"
        native_android_title: "Descarga la app para Android."
        native_android_body: "Usa el selector de archivos del propio teléfono y recibe lo que compartas desde otras apps. Reduce fotos y vídeos antes de subirlos. Los inicios de sesión y emparejamientos se aprueban en Amber en el mismo teléfono, sin código QR."
        web_too: "Si lo prefieres, la app web también funciona. En Chrome, abre el menú y toca Añadir a pantalla de inicio."
