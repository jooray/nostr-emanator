default: &default
  app:
    canonical_url: https://emanator.cypherpunk.today
  nostr:
    relays:
      - wss://relay.damus.io
      - wss://nos.lol
      - wss://relay.primal.net
      - wss://nostr.cypherpunk.today
    # NIP-46 login/pairing relays. The app subscribes on ALL of these at once and
    # Amber publishes the connect/get_public_key replies to the same set, so more
    # healthy relays = more chances the handshake completes if one is flaky. Keep
    # only relays verified to accept WS + relay ephemeral kind-24133 events.
    # relay.nsec.app (the canonical bunker relay) is omitted while it returns 502;
    # re-add it once it recovers.
    # Kept deliberately short. Every relay lands in the nostrconnect:// URI that
    # becomes the pairing QR code, and past ~600 characters phone cameras start
    # failing to scan it. Two is enough: the signer subscribes to all of them, so
    # this is redundancy against one being down, not throughput.
    #
    # nos.lol is the public fallback because it demonstrably carried this app's
    # NIP-46 traffic in production. relay.primal.net and nostr.mom also worked and
    # are equally good substitutes — they were dropped for QR size, not quality.
    auth_relays:
      - wss://nostr.cypherpunk.today
      - wss://nos.lol
    fetch_timeout: 10
    # Sent on every relay WebSocket handshake. Some relays (inbox.nostr.wine)
    # answer a User-Agent-less handshake with HTTP 403 instead of a 101.
    user_agent: "Emanator (+https://github.com/jooray/nostr-emanator)"
    # Deprecated NIP-04 (AES-256-CBC, unauthenticated) fallback for NIP-46
    # payloads. Off by default — see Nostr::Nip04Policy. Turn on only to pair a
    # signer that cannot do NIP-44.
    allow_nip04_fallback: false
    # Relays OFFERED in the "set up your DM inbox" picker. These are suggestions
    # only — never applied automatically, and never used as a fallback.
    #
    # Emanator does not create Nostr identities: the accounts it manages are
    # already in use in other clients, which have very likely already published a
    # kind 10050. That published list is the only truth about where an account's
    # DMs actually land, so imposing a default here would both overrule the user
    # and cause us to look for messages in the wrong place.
    #
    # `auth` marks whether the relay enforces NIP-42 on reads. It matters: a relay
    # that does NOT enforce it will serve kind 1059 to anyone, letting a third
    # party enumerate when and how many DMs the account receives (not contents).
    # Surfaced in the picker so the choice is the user's and is informed.
    # This is the intersection of 0xchat's recommendDMRelays and Amethyst's
    # user-facing suggestion string — the closest thing to consensus in the
    # ecosystem. auth.nostr1.com is listed first because it is free AND enforces
    # NIP-42, which is what NIP-17 asks inbox relays to do.
    suggested_dm_relays:
      - url: wss://auth.nostr1.com
        auth: true
        note: Free, and requires NIP-42 so only you can read your own wraps. Best default.
      - url: wss://relay.0xchat.com
        auth: false
        note: Free and widely used by 0xchat, but no NIP-42 — anyone can see that you received a message.
      - url: wss://inbox.nostr.wine
        auth: true
        paid: true
        note: Paid (~2500 sats/30 days). Requires NIP-42.

    # Unauthenticated probe targets for discovering somebody's kind 10050 before
    # we conclude they have none.
    #
    # purplepag.es is FIRST despite Amethyst's code comment calling it a
    # metadata indexer with weak kind-10050 coverage. Measured against real
    # contacts, the opposite held: a peer we had recorded as having no DM inbox
    # had published one, and purplepag.es was the ONLY relay of ten carrying it.
    # It indexes replaceable events specifically, which is exactly what a 10050
    # is. Leaving it out was manufacturing false negatives — and a false negative
    # here is the expensive kind, because it tells the user someone cannot be
    # messaged privately when they can.
    #
    # These are queried WITHOUT NIP-42 auth on purpose. Answering an AUTH
    # challenge here would tell the relay "identity U wants to DM X", which is a
    # worse leak than the one the probe exists to avoid.
    dm_indexer_relays:
      - wss://purplepag.es
      - wss://relay.nos.social
      - wss://relay.damus.io
      - wss://nos.lol
      - wss://relay.nostr.band
      - wss://purplerelay.com
    # Last-resort targets for a gift wrap when the recipient has published
    # neither a kind 10050 nor a NIP-65 read list. Yakihonne-web does the same.
    #
    # It works at all only because of an asymmetry in the ecosystem: no client
    # examined subscribes to kind 1059 on its own 10050 alone — they all fan out
    # across their whole relay pool — so a wrap on a big popular relay is usually
    # seen. It is still a best-effort guess, and the composer says so.
    fallback_dm_relays:
      - wss://relay.damus.io
      - wss://nos.lol
      - wss://relay.primal.net
      - wss://relay.nostr.band

    # Relays we ALWAYS listen on for our own inbound gift wraps, on top of our
    # kind 10050 and our NIP-65 read relays.
    #
    # These exist because two widely-used chat clients do not consult our kind
    # 10050 before deciding where to publish a wrap addressed to us:
    #
    #   0xchat  sends to the recipient's dmRelayList + inboxRelayList, but when
    #           none of those are connectable it falls back to the SENDER's own
    #           general relays (contacts.dart) — which default to
    #           recommendGeneralRelays, headed by relay.0xchat.com. Its own
    #           recommendDMRelays are auth.nostr1.com, relay.0xchat.com and
    #           inbox.nostr.wine, so the self-copy lands there too.
    #
    #   Keychat has no notion of kind 10050 at all (the string does not appear in
    #           keychat-app) — sendNip17Message writes to every connected relay,
    #           which defaults to relay.keychat.io, relay.damus.io,
    #           relay.primal.net, relay.nostr.band and relay.0xchat.com.
    #
    # So a message from either client can be perfectly NIP-17 compliant, addressed
    # to us, and still never touch a relay we were watching. Reading is the half
    # of NIP-17 the spec leaves unconstrained, which is exactly what makes this
    # legitimate: subscribing more widely can only ever find more of our own mail.
    #
    # The cost is a real one and worth stating: a `#p`-scoped REQ tells each of
    # these relays that this pubkey collects its DMs here. That is the same thing
    # the four `relays:` above already learn, not a new category of exposure — but
    # it is the reason this is a short, deliberate list rather than a wide net.
    #
    # Both were verified live (2026-08-26): free, no NIP-42, and serving kind 1059
    # to a `#p`-scoped filter. relay.keychat.io answers ONLY scoped filters — a
    # bare `{"kinds":[1059]}` returns an immediate EOSE with nothing, which is a
    # scraping guard, not a refusal. relay.nostr.band is deliberately absent: it
    # refuses our WebSocket handshake outright, and it is a search index rather
    # than anyone's DM inbox.
    dm_discovery_relays:
      - wss://relay.0xchat.com
      - wss://relay.keychat.io

    # Seeds the "this relay needs NIP-42" cache so we can authenticate on connect
    # instead of paying a rejected-subscription round-trip to find out.
    auth_required_relays:
      - wss://inbox.nostr.wine
      - wss://auth.nostr1.com

  messaging:
    # Gift wraps in flight against the signer at once. A safety limit, not a
    # tuning knob: Amber waits >=200ms before publishing any response, so this
    # costs no throughput — it is what stops a large backfill from wedging the
    # user's signer (greenart7c3/Amber#169).
    decrypt_concurrency: 6
    decrypt_batch_size: 50
    # Per account per day. A 5000-wrap spam history must not drain a phone
    # battery in one run.
    decrypt_daily_cap: 1500
    # One-hop web-of-trust lookups per user per hour. Over budget, an unknown
    # sender simply waits in Requests — the failure is always on the safe side.
    wot_lookups_per_hour: 50
    # Import legacy NIP-04 threads. ON by default: most Nostr identities have
    # never published a kind 10050, so they receive no gift wraps at all and their
    # whole DM history is kind 4 — without this the inbox is empty for most
    # people. Opt out per account via settings["legacy_dm_import"] = false.
    # Sending kind 4 is a separate, always-acknowledged downgrade.
    legacy_dm_import: true
    # Also publish a reply to the relays we actually received that peer's
    # messages on, on top of whatever their kind 10050 / NIP-65 nominates.
    #
    # This is a deliberate deviation from NIP-17's "publish only to the relays in
    # the recipient's kind 10050", and it earns its place: a relay we saw their
    # wrap arrive on is a relay their client demonstrably writes to, and both
    # clients that make this necessary (0xchat, Keychat) read from the same pool
    # they write to. It is better evidence of where they are reachable than a
    # kind 10050 they may never have published — and for Keychat, which has no
    # 10050 at all, it is the only evidence there is.
    #
    # The marginal leak is one extra relay learning "somebody gift-wrapped X",
    # from a throwaway key, on a relay X's own client already published to. Set
    # to false to follow the spec strictly.
    reply_to_observed_relays: true

  ai:
    provider: venice
    endpoint: https://api.venice.ai/api/v1
    content_model: claude-sonnet-4-6

  blossom:
    server: https://blossom.primal.net

development:
  <<: *default

test:
  <<: *default
  ai:
    provider: mock

production:
  <<: *default
