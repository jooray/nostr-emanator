enqueue_scheduled_posts:
  class: EnqueueScheduledPostsJob
  schedule: every minute

# Reconcile posts/reposts stuck in publishing / awaiting_signature (C4, H15, L17).
sweep_stuck_records:
  class: SweepStuckRecordsJob
  schedule: every 5 minutes

clear_solid_queue_finished_jobs:
  command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
  schedule: every hour at minute 12

cleanup_nostr_auth_sessions:
  command: "NostrAuthSession.cleanup_expired!"
  schedule: every hour at minute 17

# Safety net: if logins are pending but the multiplexed NIP-46 supervisor isn't
# running (e.g. after a deploy/restart), start it. No-op while one holds the lock.
ensure_nip46_supervisor:
  command: "Nip46SupervisorJob.ensure_running if NostrAuthSession.active.where(authenticated_pubkey: nil).exists?"
  schedule: every minute

# --- NIP-17 messaging ---------------------------------------------------------
# `class:` entries land on the job's own queue (:messaging), so config/queue.yml
# must list it or these silently never run.

# Pulls inbound gift wraps. Also the safety net once the persistent DM supervisor
# exists, for when it is down mid-deploy.
poll_direct_messages:
  class: PollDirectMessagesJob
  schedule: every 5 minutes

# Requeues wraps left mid-decrypt by a worker that died.
sweep_stuck_gift_wraps:
  class: SweepStuckGiftWrapsJob
  schedule: every 5 minutes

# Publishes debounced NIP-RS read-state cursors (kind 30078).
flush_read_states:
  class: FlushReadStatesJob
  schedule: every minute

# Safety net for the live gift-wrap listener, mirroring ensure_nip46_supervisor:
# restarts it after a deploy or a lost lock. No-op while one holds the lock, and
# the 5-minute poller above still covers any gap.
ensure_dm_supervisor:
  command: "DmSupervisorJob.ensure_running if Account.exists?(messaging_enabled: true)"
  schedule: every minute
